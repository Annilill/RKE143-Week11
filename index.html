<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Recipe</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 40px;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #eee;
      margin: 5px;
      padding: 8px;
      border-radius: 6px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background-color: orange;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: darkorange;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1 id="title">Loading...</h1>

    <img id="image" src="" alt="Recipe Image">

    <h3>Instructions</h3>
    <p id="instructions"></p>

    <h3>Ingredients</h3>
    <ul id="ingredients"></ul>

    <button onclick="loadRecipe()">Get Random Recipe</button>
  </div>

  <script>
    async function loadRecipe() {

      const response = await fetch("https://rke143-week11-nb41.onrender.com/random");

      const data = await response.json();

      document.getElementById("title").textContent = data.recipe.recipename;

      document.getElementById("image").src = data.recipe.imageurl;

      document.getElementById("instructions").textContent = data.recipe.instructions;

      const ingredientsList = document.getElementById("ingredients");

      ingredientsList.innerHTML = "";

      data.ingredients.forEach(ingredient => {

        const li = document.createElement("li");

        li.textContent = ingredient;

        ingredientsList.appendChild(li);

      });
    }

    loadRecipe();
  </script>

</body>
</html>
